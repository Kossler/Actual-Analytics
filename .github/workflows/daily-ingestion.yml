name: Data Ingestion

# Loads nflverse data as soon as it is published. Each dataset has its own schedule (see
# ingest/SCHEDULE.md), and the actual publish times drift, so rather than guessing times this
# checks every source file often and loads only the tables whose files changed. The check is a
# few HEAD requests and takes seconds; a run where nothing changed stops there.
on:
  schedule:
    # All times UTC. In season (September-February): every 30 minutes.
    - cron: "7,37 * * 1,2,9-12 *"
    # Offseason (March-August): every 3 hours, for free agency, the draft, roster moves and
    # depth charts; game data does not change.
    - cron: "17 */3 * 3-8 *"

  workflow_dispatch:
    inputs:
      tables:
        description: 'Comma-separated tables to load (blank = every table)'
        required: false
        default: ''
      all_seasons:
        description: 'Every season instead of only the latest. With tables blank, refills the whole database (can take an hour or more)'
        type: boolean
        default: false
      changed_only:
        description: 'Only load tables whose source files changed (what scheduled runs do)'
        type: boolean
        default: false

# One ingestion at a time; a run that starts while another is loading waits for it.
concurrency:
  group: ingestion
  cancel-in-progress: false

env:
  # The tables the site uses. participation (who was on the field each play, for the offensive
  # line) is published only after each season ends; until then it loads nothing. depth_charts_sleeper
  # comes from Sleeper, once a day.
  DEFAULT_TABLES: schedules,teams,players,rosters_weekly,player_stats,pbp,snap_counts,nextgen_stats,nextgen_rushing,nextgen_receiving,contracts,injuries,depth_charts_current,depth_charts_sleeper,pfr_advstats_pass,pfr_advstats_rush,pfr_advstats_rec,pfr_advstats_def,ftn_charting,ff_opportunity,participation

jobs:
  # Which tables have new source files since they were last loaded (scheduled runs only).
  check-sources:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tables: ${{ steps.check.outputs.tables }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install requests psycopg2-binary
      - id: check
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          TABLES: ${{ env.DEFAULT_TABLES }}
        run: |
          cd ingest
          python sources.py check

  ingest-data:
    needs: check-sources
    # Scheduled: only when something changed. Manual: always.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.check-sources.result == 'success' && needs.check-sources.outputs.tables != '')) }}
    runs-on: ubuntu-latest
    # A full refill of every table's history can take an hour or more; leave room, short of GitHub's
    # 6-hour cap, so a stuck run still ends.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd ingest
          pip install -r requirements.txt
      
      - name: Load changed data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          LATEST_SEASON: ${{ inputs.all_seasons && '0' || '1' }}
          # Scheduled runs: the changed tables. Manual runs: the requested tables, else all of them.
          TABLES: ${{ inputs.tables || needs.check-sources.outputs.tables || env.DEFAULT_TABLES }}
          # Re-checked at load time, which also reads the file versions to record after loading.
          CHANGED_ONLY: ${{ (github.event_name == 'schedule' || inputs.changed_only) && '1' || '0' }}
          # Upsert the tables whose existing rows can change (stat corrections, rebrands); without it a
          # reload skips rows already stored. contracts and depth charts are replaced outright instead.
          UPSERT_TABLES: 'schedules,teams,players,rosters_weekly,player_stats,pbp,snap_counts,nextgen_stats,nextgen_rushing,nextgen_receiving,injuries,pfr_advstats_pass,pfr_advstats_rush,pfr_advstats_rec,pfr_advstats_def,ftn_charting,ff_opportunity'
          UPSERT: '0'
          PROCESSES: '4'
          CHUNK_SIZE: '50000'
          # Stream log lines as they happen, so a killed run still shows how far it got.
          PYTHONUNBUFFERED: '1'
        # A failed loader fails the run (and GitHub emails you); tables that did load are still saved.
        # Multi-season loads run one season per worker process, so a full refill stays within the
        # runner's memory.
        run: |
          cd ingest
          python populate_tables.py

      # Purge the API from Cloudflare's edge cache so visitors get the new data.
      # Skipped until the API is served through a Cloudflare-proxied hostname and these secrets exist:
      #   CLOUDFLARE_ZONE_ID, CLOUDFLARE_API_TOKEN (Zone > Cache Purge permission), API_HOSTNAME (e.g. api.secondlevelanalytics.com)
      - name: Purge API edge cache
        # Run even if some loaders failed: the tables that loaded still changed the data.
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_HOSTNAME: ${{ secrets.API_HOSTNAME }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$API_HOSTNAME" ]; then
            echo "Cloudflare secrets not set; skipping edge cache purge."
            exit 0
          fi
          # The API polls data_version every 60s; wait until every instance has dropped its
          # in-memory cache, or the edge could re-cache old responses right after the purge.
          sleep 90
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"${API_HOSTNAME}\"]}"
