name: Daily Data Ingestion

on:
  schedule:
    # All schedules are in UTC (GitHub Actions standard).
    # Times are set to run ~3 hours after the final game of each slate ends (ET).
    # Daylight Saving Time is handled automatically via UTC → ET conversion.

    # TNF (Thursday Night Football)
    # Game ends ~11:15 PM ET → Run at ~2:15 AM ET (7:15 AM UTC Friday)
    - cron: "15 7 * 1,2,9-12 5"

    # Sunday Early Window
    # Games end ~4:15 PM ET → Run at ~7:15 PM ET (12:15 AM UTC Monday)
    - cron: "15 0 * 1,2,9-12 1"

    # Sunday Late Window
    # Games end ~7:15 PM ET → Run at ~10:15 PM ET (3:15 AM UTC Monday)
    - cron: "15 3 * 1,2,9-12 1"

    # Sunday Night Football (SNF)
    # Game ends ~11:15 PM ET → Run at ~2:15 AM ET (7:15 AM UTC Monday)
    - cron: "15 7 * 1,2,9-12 1"

    # Monday Night Football (MNF)
    # Game ends ~11:15 PM ET → Run at ~2:15 AM ET (7:15 AM UTC Tuesday)
    - cron: "15 7 * 1,2,9-12 2"


  workflow_dispatch:
    inputs:
      tables:
        description: 'Comma-separated tables to load (blank = the usual set)'
        required: false
        default: ''
      all_seasons:
        description: 'Load every season instead of only the latest (backfills)'
        type: boolean
        default: false


jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd ingest
          pip install -r requirements.txt
      
      - name: Run current season data update
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          LATEST_SEASON: ${{ inputs.all_seasons && '0' || '1' }}
          # Refresh app-critical tables (these tables contain all seasons; we load only the latest season rows).
          # participation is omitted: nflverse stopped publishing it after 2025 and the app doesn't use it.
          TABLES: ${{ inputs.tables || 'schedules,teams,players,rosters_weekly,player_stats,pbp,snap_counts,nextgen_stats,nextgen_rushing,nextgen_receiving,contracts,injuries,depth_charts_current,pfr_advstats_pass,pfr_advstats_rush,pfr_advstats_rec,pfr_advstats_def,ftn_charting' }}
          # Upsert only the tables that can change as stats are recalculated.
          UPSERT_TABLES: 'schedules,players,rosters_weekly,player_stats,pbp,snap_counts,nextgen_stats,nextgen_rushing,nextgen_receiving,injuries,pfr_advstats_pass,pfr_advstats_rush,pfr_advstats_rec,pfr_advstats_def,ftn_charting'
          UPSERT: '0'
          PROCESSES: '4'
          CHUNK_SIZE: '50000'
        # A failed loader fails the run (and GitHub emails you); tables that did load are still saved.
        run: |
          cd ingest
          python populate_tables.py

      # Purge the API from Cloudflare's edge cache so visitors get the new data.
      # Skipped until the API is served through a Cloudflare-proxied hostname and these secrets exist:
      #   CLOUDFLARE_ZONE_ID, CLOUDFLARE_API_TOKEN (Zone > Cache Purge permission), API_HOSTNAME (e.g. api.secondlevelanalytics.com)
      - name: Purge API edge cache
        # Run even if some loaders failed: the tables that loaded still changed the data.
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_HOSTNAME: ${{ secrets.API_HOSTNAME }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$API_HOSTNAME" ]; then
            echo "Cloudflare secrets not set; skipping edge cache purge."
            exit 0
          fi
          # The API polls data_version every 60s; wait until every instance has dropped its
          # in-memory cache, or the edge could re-cache old responses right after the purge.
          sleep 90
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"${API_HOSTNAME}\"]}"
