# Cloudflare Pages/Workers runtime configuration
# This is used by Cloudflare during Pages Functions publishing.
#
# The Next.js SSR worker generated by @cloudflare/next-on-pages imports
# Node built-ins (e.g. node:buffer, node:async_hooks). These require
# the Node.js compatibility flag.

# Use a real (non-future) date; Cloudflare may reject future dates.
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
